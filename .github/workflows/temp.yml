name: 一次性清理旧 Release（手动触发）

on:
  workflow_dispatch:   # 只能手动触发，避免误跑

permissions:
  contents: write

jobs:
  cleanup:
    name: 清理不符合 rawname 规范的旧 Release
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install pygithub

      - name: 执行清理
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import json
          from github import Github, Auth

          token = os.getenv('GITHUB_TOKEN')
          g = Github(auth=Auth.Token(token))
          repo = g.get_repo(os.getenv('GITHUB_REPOSITORY'))

          # 读取 targets.json，收集合法 tag
          with open('task/targets.json', 'r', encoding='utf-8') as f:
              targets = json.load(f)

          valid_tags = set()
          for item in targets:
              rawname = item.get('rawname', item.get('name'))
              if rawname:
                  valid_tags.add(f"{rawname}-latest")

          print("✅ 合法 tag 列表：")
          for t in sorted(valid_tags):
              print(f"  - {t}")
          print()

          # 遍历所有 Release，删除以 -latest 结尾但不在合法集合里的
          deleted = 0
          for rel in repo.get_releases():
              tag = rel.tag_name
              if not tag.endswith("-latest"):
                  continue
              if tag in valid_tags:
                  print(f"⏭️ 保留：{tag}")
                  continue
              print(f"🗑️ 删除旧 Release：{tag} （标题：{rel.title}）")
              rel.delete_release()
              deleted += 1

          print(f"\n🎉 清理完成，共删除 {deleted} 个旧 Release。")
          EOF
