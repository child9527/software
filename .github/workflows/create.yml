name: Deploy to child9527.github.io

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: pip install PyGithub

    - name: Generate index.html
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        python scripts/index.py

    - name: Checkout target repo (child9527.github.io)
      uses: actions/checkout@v4
      with:
        repository: child9527/child9527.github.io
        token: ${{ secrets.GITHUB_TOKEN }}
        path: target

    - name: Copy index.html to target repo
      run: |
        cp index.html target/index.html

    - name: Commit & Push
      run: |
        cd target
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add index.html
        git commit -m "Auto update index.html"
        git push
