name: 自动同步指定软件最新 Releases

on:
  push:
    paths:
      - "task/targets.json"    # 只有 targets.json 被修改时才触发 workflow
      - "scripts/sync_releases.py"
      - ".github/workflows/sync_releases.yml"
  schedule:
    - cron: '0 3 * * *'        # 每天北京时间 11:00 自动检查同步
  workflow_dispatch:            # 支持在 Actions 页面手动触发执行

permissions:
  contents: write

jobs:
  sync-assets:
    name: 检查并更新最新软件安装包
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行同步与 Release 更新
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_releases.py
