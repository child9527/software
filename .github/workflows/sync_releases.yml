name: 自动同步指定软件最新 Releases

on:
  push:
    paths:
      - "task/targets.json"    #只有 targets.json 被修改时才触发 workflow
  schedule:
    - cron: '0 3 * * *'  # 每天北京时间 11:00 自动检查同步
  workflow_dispatch:      # 支持在 Actions 页面手动触发执行

permissions:
  contents: write

jobs:
  sync-assets:
    name: 检查并更新最新软件安装包
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install requests pygithub

      - name: 执行同步与 Release 更新
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          import json
          import re
          import time
          import requests
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from github import Github, Auth

          token = os.getenv('GITHUB_TOKEN')
          auth = Auth.Token(token)
          g = Github(auth=auth)
          current_repo = g.get_repo(os.getenv('GITHUB_REPOSITORY'))

          # 读取配置文件
          with open('task/targets.json', 'r', encoding='utf-8') as f:
              targets = json.load(f)

          # 镜像池及权重字典设置（权重值越小越优先）
          WEIGHT_MAP = {
              "https://web.ksx.qzz.io/": 0.10,  # 第一优先
              "https://gh-proxy.com/": 0.15,   # 第二优先
              "https://wget.la/": 0.20,        # 第三优先
          }
          DEFAULT_WEIGHT = 0.30

          CANDIDATE_MIRRORS = [
              ("KSX 镜像", "https://web.ksx.qzz.io/"),
              ("GH-Proxy Com", "https://gh-proxy.com/"),
              ("Wget LA", "https://wget.la/"),
              ("GH-Proxy Org", "https://gh-proxy.org/"),
              ("GHProxy Net", "https://ghproxy.net/"),
              ("Mirror GHProxy", "https://mirror.ghproxy.com/"),
              ("DDLC 镜像", "https://gh.ddlc.top/"),
              ("GH API 镜像", "https://gh.api.99988866.xyz/"),
              ("GH Cache ICU", "https://gh.cache.icu/"),
              ("GH CON", "https://gh.con.sh/"),
              ("GH LLKK", "https://gh.llkk.cc/"),
              ("GH VIP 代理", "https://ghproxy.vip/"),
          ]

          def test_mirror_speed(mirror_info):
              """测试单个镜像站点的响应延迟 (秒) 并加上指定权重进行综合计分"""
              name, prefix = mirror_info
              weight = WEIGHT_MAP.get(prefix, DEFAULT_WEIGHT)
              test_url = f"{prefix}https://raw.githubusercontent.com/github/docs/main/README.md"
              try:
                  start_time = time.time()
                  res = requests.head(test_url, timeout=3, allow_redirects=True)
                  latency = time.time() - start_time
                  if res.status_code < 400:
                      total_score = latency + weight
                      return {
                          "name": name, 
                          "prefix": prefix, 
                          "latency": latency, 
                          "weight": weight, 
                          "total_score": total_score, 
                          "ok": True
                      }
              except Exception:
                  pass
              return {"name": name, "prefix": prefix, "latency": 999, "weight": weight, "total_score": 999, "ok": False}

          def get_sorted_mirrors():
              """多线程并发测速，返回按综合评分（延迟+权重）升序排列的可用镜像列表"""
              print("🔍 正在对 GH-Proxy 镜像节点进行并发测速与权重评分...")
              sorted_results = []
              with ThreadPoolExecutor(max_workers=len(CANDIDATE_MIRRORS)) as executor:
                  futures = [executor.submit(test_mirror_speed, m) for m in CANDIDATE_MIRRORS]
                  for future in as_completed(futures):
                      res = future.result()
                      if res["ok"]:
                          sorted_results.append(res)

              sorted_results.sort(key=lambda x: x["total_score"])
              
              print("⏱️ 镜像综合优选结果 (按权重+延迟由优到劣):")
              for r in sorted_results:
                  print(f"  - {r['name']} ({r['prefix']}): 延迟 {r['latency']*1000:.0f}ms | 权重 {r['weight']:.2f} | 综合得分: {r['total_score']:.3f}")
              
              return sorted_results

          active_mirrors = get_sorted_mirrors()

          for item in targets:
              software_name = item['name']
              target_repo_name = item['repo']
              pattern = item['asset_pattern']

              print(f"\n==========================================")
              print(f"正在检查软件: {software_name} ({target_repo_name})")

              try:
                  target_repo = g.get_repo(target_repo_name)
                  
                  all_releases = list(target_repo.get_releases())
                  if not all_releases:
                      print(f"⚠️ 在上游仓库 {target_repo_name} 中未找到任何 Release，跳过。")
                      continue

                  latest_release = all_releases[0]
                  upstream_tag_name = latest_release.tag_name

                  if latest_release.prerelease:
                      print(f"ℹ️ 检测到最新版本为预发行版 (Pre-release): {upstream_tag_name}")

                  # 🟢 优化后的 Asset 匹配与版本号精确校验逻辑
                  download_url = None
                  file_name = None
                  clean_version = upstream_tag_name.lstrip('vV')

                  matching_assets = []
                  for asset in latest_release.get_assets():
                      if re.search(pattern, asset.name, re.IGNORECASE):
                          matching_assets.append(asset)

                  if matching_assets:
                      exact_match = None
                      for asset in matching_assets:
                          if clean_version in asset.name:
                              exact_match = asset
                              break
                      
                      chosen_asset = exact_match if exact_match else matching_assets[0]
                      download_url = chosen_asset.browser_download_url
                      file_name = chosen_asset.name

                  if not download_url:
                      print(f"⚠️ 在上游仓库中未找到符合规则 '{pattern}' 的文件，跳过。")
                      continue

                  print(f"🎯 锁定目标下载文件: {file_name}")

                  # 统一 Release 标签规范
                  release_tag = f"{software_name.lower().replace(' ', '-')}-latest"
                  
                  target_release = None
                  for rel in current_repo.get_releases():
                      if rel.tag_name == release_tag:
                          target_release = rel
                          break

                  raw_download_url = f"https://github.com/{current_repo.full_name}/releases/download/{release_tag}/{file_name}"
                  upstream_release_url = f"https://github.com/{target_repo_name}/releases/tag/{upstream_tag_name}"

                  mirror_text = "### 🚀 国内网络镜像加速下载\n"
                  mirror_text += f"如下方 Asset 下载缓慢，可点击以下直链加速下载 **`{file_name}`**：\n\n"
                  
                  for idx, m in enumerate(active_mirrors):
                      tag = " ⚡ [综合最快/最优推荐]" if idx == 0 else ""
                      latency_ms = f"{m['latency']*1000:.0f}ms"
                      mirror_text += f"- **[{m['name']}{tag}]({m['prefix']}{raw_download_url})** *(延迟: {latency_ms} | 综合得分: {m['total_score']:.3f})*\n"
                  
                  release_body = (
                      f"🔗 **上游源头**：[{target_repo_name} ({upstream_tag_name})]({upstream_release_url})\n\n"
                      f"{mirror_text}"
                  )

                  if target_release:
                      existing_assets = [a.name for a in target_release.get_assets()]
                      
                      if file_name in existing_assets:
                          target_release.update_release(name=software_name, message=release_body)
                          print(f"✅ 当前已是最新版本 ({file_name})，已更新最新测速与加速直链。")
                          continue
                      
                      print(f"🗑️ 检测到上游新版本 ({file_name})，正在清理本地旧包...")
                      for old_asset in target_release.get_assets():
                          old_asset.delete_asset()
                      target_release.update_release(name=software_name, message=release_body)

                  else:
                      print(f"📦 首次同步，正在创建 Release 标签: {release_tag}")
                      target_release = current_repo.create_git_release(
                          tag=release_tag,
                          name=software_name,
                          message=release_body,
                          draft=False,
                          prerelease=False
                      )

                  print(f"⬇️ 正在下载最新成品包: {file_name} ...")
                  res = requests.get(download_url, stream=True)
                  res.raise_for_status()
                  with open(file_name, 'wb') as out_file:
                      for chunk in res.iter_content(chunk_size=8192):
                          out_file.write(chunk)

                  print(f"⬆️ 正在上传成品至本仓库 Release...")
                  target_release.upload_asset(path=file_name, label=file_name)
                  print(f"🎉 {software_name} 成功更新至最新版！")

                  if os.path.exists(file_name):
                      os.remove(file_name)

              except Exception as e:
                  print(f"❌ 处理 {software_name} 时发生异常: {str(e)}")

          EOF
