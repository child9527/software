name: 自动同步 LX Music 资源

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  check-and-sync:
    name: 检测上游 Release 并同步
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 检查上游最新 Release 版本
        id: check_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "正在查询 guoyue2010/lxmusic- 最新 Release..."
          
          # 加上 GITHUB_TOKEN 与 User-Agent，避免 403 Rate Limit 限制
          LATEST_RELEASE=$(curl -s -H "Authorization: token $GH_TOKEN" -H "User-Agent: GitHub-Actions" https://api.github.com/repos/guoyue2010/lxmusic-/releases/latest)
          LATEST_TAG=$(echo "$LATEST_RELEASE" | jq -r '.tag_name')
          
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "❌ 获取上游 Release 失败或未发现 Tag！"
            echo "API 返回响应如下："
            echo "$LATEST_RELEASE"
            exit 1
          fi
          
          echo "上游最新 Tag: $LATEST_TAG"
          
          LOCAL_TAG=""
          if [ -f "lxSources/version.txt" ]; then
            LOCAL_TAG=$(cat lxSources/version.txt)
          fi
          echo "本地已同步 Tag: $LOCAL_TAG"

          if [ "$LATEST_TAG" = "$LOCAL_TAG" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 上游未发布新版本 ($LATEST_TAG)，直接结束检测。"
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
            echo "⚡ 检测到需要同步（上游新版本: $LATEST_TAG），开始执行后续任务..."
          fi

      - name: 获取 zip 下载地址并下载
        if: steps.check_tag.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_JSON=$(curl -s -H "Authorization: token $GH_TOKEN" -H "User-Agent: GitHub-Actions" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/guoyue2010/lxmusic-/releases/latest)
          
          ZIP_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' | head -n 1)
          
          if [ -z "$ZIP_URL" ] || [ "$ZIP_URL" = "null" ]; then
            echo "❌ 最新 Release 中未提取到 .zip 资产文件！"
            exit 1
          fi
          
          echo "找到 zip 下载链接: $ZIP_URL"
          curl -L -H "Authorization: token $GH_TOKEN" -H "User-Agent: GitHub-Actions" -o latest.zip "$ZIP_URL"

      - name: 清理旧文件并解压新资源到平铺目录
        if: steps.check_tag.outputs.should_run == 'true'
        run: |
          TARGET_DIR="lxSources/guoyue2010"

          # 1. 彻底清空原有目录并重新创建
          echo "🧹 正在彻底清空 $TARGET_DIR 目录..."
          rm -rf "$TARGET_DIR"
          mkdir -p "$TARGET_DIR"
          mkdir -p temp_unzip

          # 2. 临时解压到临时目录
          echo "📦 正在解压新文件..."
          unzip -o latest.zip -d temp_unzip/

          # 3. 寻找解压出来的子目录并把里面的文件提取到 lxSources/guoyue2010/
          echo "🚚 提取文件到 $TARGET_DIR/ ..."
          SUB_DIR=$(find temp_unzip -mindepth 1 -maxdepth 2 -type d | head -n 1)
          if [ -n "$SUB_DIR" ]; then
            mv "$SUB_DIR"/* "$TARGET_DIR"/
          else
            # 如果 zip 包内部没有子文件夹，直接全部移动
            mv temp_unzip/* "$TARGET_DIR"/
          fi

          # 4. 清理临时文件夹和 zip 压缩包
          rm -rf temp_unzip latest.zip

          # 5. 在 lxSources 根目录下记录当前同步的版本号
          echo "${{ steps.check_tag.outputs.latest_tag }}" > lxSources/version.txt
          echo "📝 版本记录更新为: ${{ steps.check_tag.outputs.latest_tag }}"

      - name: 提交更新到仓库
        if: steps.check_tag.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add lxSources
          if ! git diff --staged --quiet; then
            git commit -m "Auto Sync lxSources/guoyue2010 to upstream release ${{ steps.check_tag.outputs.latest_tag }}"
            git push
            echo "✅ 成功更新至上游最新版本 ${{ steps.check_tag.outputs.latest_tag }}！"
          else
            echo "ℹ️ 解压内容与本地一致，无需提交。"
          fi
