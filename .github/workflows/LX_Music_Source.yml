name: 自动同步 LX Music 资源

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  check-and-sync:
    name: 检测上游 Release 并同步
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 检查上游最新 Release 版本
        id: check_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "正在查询 guoyue2010/lxmusic- 最新 Release..."
          
          LATEST_RELEASE=$(curl -s -H "Authorization: token $GH_TOKEN" -H "User-Agent: GitHub-Actions" https://api.github.com/repos/guoyue2010/lxmusic-/releases/latest)
          LATEST_TAG=$(echo "$LATEST_RELEASE" | jq -r '.tag_name')
          
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "❌ 获取上游 Release 失败或未发现 Tag！"
            echo "API 返回响应如下："
            echo "$LATEST_RELEASE"
            exit 1
          fi
          
          echo "上游最新 Tag: $LATEST_TAG"
          
          LOCAL_TAG=""
          if [ -f "lxSources/version.txt" ]; then
            LOCAL_TAG=$(cat lxSources/version.txt)
          fi
          echo "本地已同步 Tag: $LOCAL_TAG"

          if [ "$LATEST_TAG" = "$LOCAL_TAG" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 上游未发布新版本 ($LATEST_TAG)，直接结束检测。"
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
            echo "⚡ 检测到需要同步（上游新版本: $LATEST_TAG），开始执行后续任务..."
          fi

      - name: 获取压缩包下载地址并下载
        if: steps.check_tag.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_JSON=$(curl -s -H "Authorization: token $GH_TOKEN" -H "User-Agent: GitHub-Actions" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/guoyue2010/lxmusic-/releases/latest)
          
          ARCHIVE_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | (endswith(".7z") or endswith(".zip"))) | .browser_download_url' | head -n 1)
          
          if [ -z "$ARCHIVE_URL" ] || [ "$ARCHIVE_URL" = "null" ]; then
            echo "❌ 最新 Release 中未提取到 .7z 或 .zip 资产文件！"
            exit 1
          fi
          
          echo "找到压缩包下载链接: $ARCHIVE_URL"
          if [[ "$ARCHIVE_URL" == *.7z ]]; then
            curl -L -H "Authorization: token $GH_TOKEN" -H "User-Agent: GitHub-Actions" -o archive.7z "$ARCHIVE_URL"
          else
            curl -L -H "Authorization: token $GH_TOKEN" -H "User-Agent: GitHub-Actions" -o archive.zip "$ARCHIVE_URL"
          fi

      - name: 彻底清空旧文件并解压新资源
        if: steps.check_tag.outputs.should_run == 'true'
        run: |
          TARGET_DIR="lxSources/guoyue2010"

          # 1. 彻底清空原有目录
          echo "🧹 彻底清空 $TARGET_DIR 目录..."
          rm -rf "$TARGET_DIR"
          mkdir -p "$TARGET_DIR"
          mkdir -p temp_unzip

          # 2. 解压文件
          echo "📦 正在解压新文件..."
          if [ -f "archive.7z" ]; then
            sudo apt-get update && sudo apt-get install -y p7zip-full
            7z x archive.7z -otemp_unzip/ -y
          elif [ -f "archive.zip" ]; then
            unzip -o archive.zip -d temp_unzip/
          fi

          # 3. 递归查找 temp_unzip 内所有 .js 文件，平铺移动到 TARGET_DIR
          echo "🚚 正在提取解压出的 .js 文件..."
          find temp_unzip -type f -name "*.js" -exec mv {} "$TARGET_DIR"/ \;

          # 4. 检查是否成功提取到了文件
          JS_COUNT=$(find "$TARGET_DIR" -maxdepth 1 -name "*.js" | wc -l)
          if [ "$JS_COUNT" -eq 0 ]; then
            echo "❌ 警告：未在解压包中提取到任何 .js 文件！"
            exit 1
          fi

          echo "✅ 成功提取到 $JS_COUNT 个 .js 音源文件，列表如下："
          ls -la "$TARGET_DIR"

          # 5. 清理临时解压目录与压缩包
          rm -rf temp_unzip archive.7z archive.zip

          # 6. 更新版本号文件
          echo "${{ steps.check_tag.outputs.latest_tag }}" > lxSources/version.txt
          echo "📝 版本记录更新为: ${{ steps.check_tag.outputs.latest_tag }}"

      - name: 提交更新到仓库
        if: steps.check_tag.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A lxSources
          if ! git diff --staged --quiet; then
            git commit -m "Auto Sync lxSources/guoyue2010 to upstream release ${{ steps.check_tag.outputs.latest_tag }}"
            git push
            echo "✅ 成功更新至上游最新版本 ${{ steps.check_tag.outputs.latest_tag }}！"
          else
            echo "ℹ️ 解压内容与本地一致，无需提交。"
          fi
